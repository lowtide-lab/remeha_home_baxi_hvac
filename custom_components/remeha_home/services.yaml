get_schedule:
  target:
    entity:
      integration: remeha_home
      domain: climate
  fields:
    program_type:
      example: heating
      selector:
        select:
          options: [heating, cooling]
    program_number:
      example: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box

set_schedule:
  target:
    entity:
      integration: remeha_home
      domain: climate
  fields:
    program_type:
      example: heating
      selector:
        select:
          options: [heating, cooling]
    program_number:
      example: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box
    switch_points:
      required: true
      example: '[{"day": 0, "time": "06:00", "activity": 2}, {"day": 0, "time": "22:00", "activity": 1}]'
      selector:
        object:

get_hot_water_schedule:
  target:
    entity:
      integration: remeha_home
      domain: water_heater

set_hot_water_schedule:
  target:
    entity:
      integration: remeha_home
      domain: water_heater
  fields:
    switch_points:
      required: true
      example: '[{"day": 0, "time": "06:00", "comfortActive": true}, {"day": 0, "time": "22:00", "comfortActive": false}]'
      selector:
        object:

set_holiday:
  fields:
    start_date:
      required: true
      example: "2026-12-20"
      selector:
        date:
    end_date:
      required: true
      example: "2026-12-27"
      selector:
        date:
    device_id:
      selector:
        device:
          integration: remeha_home
          multiple: true

clear_holiday:
  fields:
    device_id:
      selector:
        device:
          integration: remeha_home
          multiple: true

set_temporary_override:
  target:
    entity:
      integration: remeha_home
      domain: climate
  fields:
    temperature:
      required: true
      example: 21
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    duration:
      required: true
      example: "01:30:00"
      selector:
        duration:

get_energy_history:
  fields:
    start_date:
      required: true
      example: "2026-11-01"
      selector:
        date:
    end_date:
      required: true
      example: "2026-11-26"
      selector:
        date:
    device_id:
      selector:
        device:
          integration: remeha_home
    include_days:
      default: true
      selector:
        boolean:
